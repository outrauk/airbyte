[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "4.20.0"
name = "source-s3"
description = "Source implementation for S3."
authors = [ "Airbyte <contact@airbyte.io>",]
license = "ELv2"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/sources/s3"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"
[[tool.poetry.packages]]
include = "source_s3"

[tool.poetry.dependencies]
python = "^3.10,<3.14"
pytz = "^2024.2"
wcmatch = "^10.0"
dill = "^0.3.4"
transformers = "^4.38.2"
urllib3 = "<2"
# Pinned to an exact version (not a caret range) rather than "^7.0.0": source_s3/v4/csv_parser.py
# duplicates internal, unversioned CDK logic (_CsvReader.read_data / _row_to_dict) that isn't part
# of airbyte-cdk's public API, to implement pad_missing_columns (see plan-pad-missing-columns.md).
# A `poetry update` picking a different 7.x release could silently change that internal method's
# shape underneath the duplicated copy. Bump this deliberately and re-diff csv_parser.py against
# the new version (and re-run unit_tests/v4/test_csv_parser.py's anti-drift test) before bumping.
airbyte-cdk = {extras = ["file-based"], version = "7.23.6"}
pendulum = "^3.0.0"
psutil = "^7.0.0"
numpy = ">=2.2.6,<3"
# Already resolved transitively (via google-auth); declared explicitly because zip_reader.py
# imports it directly for WinZip AES-256 zip decryption.
cryptography = ">=42.0.0"

[tool.poetry.scripts]
source-s3 = "source_s3.run:run"

[tool.poetry.dependencies.smart-open]
extras = [ "s3",]
version = "^5.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
moto = "==4.2.14"
docker = "^7.0.0"
pytest-mock = "^3.6.1"
requests-mock = "^1.9.3"
pandas = "^2.0.3"

[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
