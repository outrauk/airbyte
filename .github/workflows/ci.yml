# This repo is a fork of airbytehq/airbyte used only to carry our own patches to the connectors
# listed below (see the `test-connectors`/`test-jvm-connectors` matrices). Unlike upstream Airbyte,
# we don't publish images, run the full multi-connector test matrix, or manage community PRs here.
# All we need is: our patched connectors still pass their tests, and a tag left behind on `master`
# that other repos can pin to as a git submodule when building connector images.
#
# To bring another connector under this CI, add it to *both*:
#   1. the matching filter group under `has-connector-changed.steps.filter.with.filters` -
#      `python-connectors` for a Python connector, `jvm-connectors` for a JVM one (also add its
#      own shared CDK toolkit path there if it depends on one via `cdkVersion=local`, the way
#      destination-s3 depends on `legacy-task-load-object-storage`), and
#   2. that connector's own `strategy.matrix.connector` list - `test-connectors` for Python,
#      `test-jvm-connectors` for JVM.

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      app-version: ${{ steps.bump-version.outputs.app-version }}
      tag: ${{ steps.bump-version.outputs.tag }}
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        repository: outrauk/shared-github-actions-workflows
        token: ${{ secrets.SHARED_GITHUB_ACTIONS_WORKFLOWS_GITHUB_TOKEN }}
        path: shared-github-actions-workflows
    - name: Bump version
      id: bump-version
      uses: ./shared-github-actions-workflows/.github/actions/bump-version
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release-branches: "master"
        tag-prefix: "v"
        pep440-compliant: "false"

  has-connector-changed:
    name: Has a maintained connector changed
    runs-on: ubuntu-24.04
    outputs:
      python-connector-changed: ${{ steps.filter.outputs.python-connectors }}
      jvm-connector-changed: ${{ steps.filter.outputs.jvm-connectors }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            python-connectors:
              - 'airbyte-integrations/connectors/source-s3/**'
            jvm-connectors:
              - 'airbyte-integrations/connectors/destination-s3/**'
              - 'airbyte-cdk/bulk/toolkits/legacy-task-load-object-storage/**'

  test-connectors:
    name: Test ${{ matrix.connector }}
    needs: [has-connector-changed]
    if: needs.has-connector-changed.outputs.python-connector-changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        connector: [source-s3]
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          check-latest: true
          update-environment: true

      - name: Install and configure Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev

      - name: Install Poe
        run: uv tool install poethepoet

      - name: Install connector dependencies
        working-directory: airbyte-integrations/connectors/${{ matrix.connector }}
        run: poe install

      - name: Run unit tests
        working-directory: airbyte-integrations/connectors/${{ matrix.connector }}
        run: poe test-unit-tests

  test-jvm-connectors:
    name: Test ${{ matrix.connector }} (JVM)
    needs: [has-connector-changed]
    if: needs.has-connector-changed.outputs.jvm-connector-changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        connector: [destination-s3]
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Runs both the connector's own tests and the shared CDK toolkit's it depends on via
      # cdkVersion=local - that toolkit is where our actual patches live, so its tests are what
      # actually exercise a fix like this one, not just the connector's own (thinner) test suite.
      - name: Run unit tests
        run: >-
          ./gradlew
          ":airbyte-integrations:connectors:${{ matrix.connector }}:test"
          ":airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-load-object-storage:test"

  tag-and-release:
    name: Tag And Release
    # An explicit if: replaces the default implicit success()-based gate, so every condition
    # that matters has to be spelled out here - including that neither test job actually failed.
    # `!= 'failure'` rather than `== 'success'`: a test job that was legitimately skipped (its
    # connector didn't change) must not block the other one's release.
    #
    # !cancelled() is required here too: by default GitHub skips a job outright when ANY of its
    # needs didn't run, before even looking at its own if: - and test-connectors/test-jvm-connectors
    # are each routinely skipped whenever only the other one's connector changed. !cancelled()
    # forces this if: to actually be evaluated in that case, so the != 'failure' checks below are
    # the real gate instead of an accidental skip.
    if: >-
      !cancelled() &&
      github.ref_name == 'master' &&
      (needs.has-connector-changed.outputs.python-connector-changed == 'true' ||
       needs.has-connector-changed.outputs.jvm-connector-changed == 'true') &&
      needs.test-connectors.result != 'failure' &&
      needs.test-jvm-connectors.result != 'failure'
    needs:
      - bump-version
      - has-connector-changed
      - test-connectors
      - test-jvm-connectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: outrauk/shared-github-actions-workflows
          token: ${{ secrets.SHARED_GITHUB_ACTIONS_WORKFLOWS_GITHUB_TOKEN }}
          path: shared-github-actions-workflows

      - name: Tag And release
        uses: ./shared-github-actions-workflows/.github/actions/tag-and-release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-branches: main
          create-release: true
          tag: ${{ needs.bump-version.outputs.app-version }}
          tag-prefix: "v"
